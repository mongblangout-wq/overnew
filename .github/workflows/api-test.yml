name: API tests (Newman)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overnew_prj
    env:
      DJANGO_DB_PATH: ci_test.sqlite3
      TEST_USERNAME: ci_tester
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: overnew_prj/requirements.txt

      - run: pip install -r requirements.txt
      - run: python manage.py migrate --run-syncdb
      - run: python tests/ci/seed_test_data.py

      - name: Start Django server
        run: python manage.py runserver 127.0.0.1:8000 --noreload &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/feed/api/hot/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not start"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman
        run: >
          newman run tests/postman/Overnew_API.postman_collection.json
          -e tests/postman/Overnew_Local.postman_environment.json
          --env-var "base_url=http://127.0.0.1:8000"
          --env-var "test_username=$TEST_USERNAME"
          --env-var "test_password=$TEST_PASSWORD"
          -r cli,htmlextra
          --reporter-htmlextra-export newman-report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: overnew_prj/newman-report.html